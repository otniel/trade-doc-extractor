[project]
name = "trade-doc-extractor"
version = "0.1.0"
description = "Self-validating extraction pipeline for trade confirmations (extract -> validate -> repair), measured by an eval harness."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.11,<3",
    "langgraph>=1.0,<2",
    "anthropic==0.120.2",
    "pymupdf>=1.26,<2",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
pythonpath = ["src"]     # src is a source root, not a package -> flat imports work
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
