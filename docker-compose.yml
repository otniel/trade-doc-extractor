version: '3.8'

services:
  app:
    build: .
    container_name: trade-doc-extractor
    volumes:
      - ./documents:/app/documents
      - ./src:/app/src
    environment:
      - POSTGRES_URL=postgresql://user:password@db:5432/trade_docs
    depends_on:
      - db
    ports:
      - "8000:8000"

  db:
    image: postgres:15
    container_name: trade-doc-db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: trade_docs
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  postgres_data:
